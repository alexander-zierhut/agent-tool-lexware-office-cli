[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-lexware-office-cli"
dynamic = ["version"]
description = "Agent-ready command-line interface for Lexware Office — contacts, invoices, and the receivables/AR-aging the API refuses to total for you."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zierhut IT" }, { name = "Alexander Zierhut" }]
keywords = [
    "lexware", "lexoffice", "lexware-office", "invoicing", "accounting", "receivables",
    "cli", "command-line", "ai-agent", "llm", "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Utilities",
]
dependencies = [
    "agent-tool-shared-cli>=0.1.2,<0.2",
    "typer>=0.12",
    "httpx>=0.27",
    "keyring>=25",
    "rich>=13",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2.3"]
build = ["pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/alexander-zierhut/agent-tool-lexware-office-cli"
Repository = "https://github.com/alexander-zierhut/agent-tool-lexware-office-cli"
Issues = "https://github.com/alexander-zierhut/agent-tool-lexware-office-cli/issues"
Changelog = "https://github.com/alexander-zierhut/agent-tool-lexware-office-cli/releases"

[project.scripts]
lexware-office = "lexwareoffice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "lexwareoffice.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: talks to a Lexware Office backend (the mock, or a real sandbox)",
]
timeout = 120
